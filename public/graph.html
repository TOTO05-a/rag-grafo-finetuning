<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grafo RAG · Grafo</title><link rel="stylesheet" href="app.css">
<style>#wrap{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 58px)}#net{height:100%}aside{border-left:1px solid var(--line);padding:18px;overflow:auto;background:var(--panel)}
.tools{position:absolute;left:16px;top:74px;display:flex;gap:8px;z-index:2}.tools input{width:240px}.tools button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:10px;width:40px;cursor:pointer}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;background:#0e1420;border:1px solid var(--line);margin:2px 4px 2px 0;cursor:pointer}@media(max-width:760px){#wrap{grid-template-columns:1fr;grid-template-rows:60% 40%}}</style></head><body>
<header><b>Grafo RAG</b><nav><a href="/">Ingesta</a><a href="/graph.html">Grafo</a><a href="/tune.html">Estrategias</a></nav></header>
<div class="tools"><input id="q" placeholder="Buscar nodo…"><button id="zi">+</button><button id="zo">−</button><button id="fit">⤢</button></div>
<div id="wrap"><div id="net"></div><aside id="side"><h2>Detalle</h2><p style="color:var(--mut)" id="info">Selecciona un nodo. Doble clic enfoca su vecindario.</p><hr style="border-color:var(--line)">
<h2>Pregunta al corpus (RAG)</h2><input id="qq" placeholder="¿Qué quieres saber?"><button class="btn" id="ask">Preguntar</button><div class="msg" id="ans" style="color:var(--tx)"></div></aside></div>
<script src="/vendor/vis-network.min.js"></script><script>
const $=i=>document.getElementById(i);const pal=['#6ee7d0','#f5b86b','#8ab4ff','#f58fa8','#b79cff','#9be37a','#ffd86b','#7bdff2'];
(async()=>{const r=await fetch('/api/graph');if(r.status===401)return location.href='/';const g=await r.json();
const types=[...new Set(g.nodes.map(n=>n.type))],col=t=>pal[types.indexOf(t)%pal.length];
const deg={};g.edges.forEach(e=>{deg[e.from]=(deg[e.from]||0)+1;deg[e.to]=(deg[e.to]||0)+1});
const nodes=new vis.DataSet(g.nodes.map(n=>({id:n.key,label:n.name,title:n.type,color:{background:col(n.type),border:'#0c1018',highlight:{background:'#fff',border:col(n.type)}},size:12+Math.min(28,(deg[n.key]||0)*4),font:{color:'#e8edf7',size:13},raw:n})));
const eds=new vis.DataSet(g.edges.filter(e=>nodes.get(e.from)&&nodes.get(e.to)).map(e=>({id:e._id,from:e.from,to:e.to,label:e.type,arrows:'to',color:{color:'#3a4a6b',highlight:'#6ee7d0'},font:{color:'#8c9ab5',size:10,strokeWidth:0},raw:e})));
if(!nodes.length)$('info').textContent='Grafo vacío: procesa un documento en Ingesta.';
const net=new vis.Network($('net'),{nodes,edges:eds},{physics:{solver:'forceAtlas2Based',stabilization:{iterations:150}},interaction:{hover:true,tooltipDelay:150},edges:{smooth:{type:'continuous'}}});
const doc=id=>g.documents[id]||'?';
function detail(n){const rel=g.edges.filter(e=>e.from===n.key||e.to===n.key);const nm=k=>(g.nodes.find(x=>x.key===k)||{}).name||k;
$('info').innerHTML=`<b style="font-size:1.1rem"></b><br><span class="pill"></span><p></p><b>Relaciones (${rel.length})</b><div id="rl"></div><b>Fuentes</b><p id="sr"></p>`;
const q=s=>$('info').querySelector(s);q('b').textContent=n.name;q('.pill').textContent=n.type;q('p').textContent=n.description||'';
rel.forEach(e=>{const o=e.from===n.key?e.to:e.from,p=document.createElement('span');p.className='pill';p.textContent=(e.from===n.key?'→ ':'← ')+e.type+' · '+nm(o);p.onclick=()=>{net.selectNodes([o]);net.focus(o,{scale:1.2,animation:true});detail(g.nodes.find(x=>x.key===o))};$('rl').append(p)});
$('sr').textContent=(n.docIds||[]).map(doc).join(', ')}
net.on('selectNode',p=>detail(nodes.get(p.nodes[0]).raw));
net.on('doubleClick',p=>{if(p.nodes[0]){const nb=net.getConnectedNodes(p.nodes[0]).concat(p.nodes);net.fit({nodes:nb,animation:true})}});
$('q').oninput=e=>{const v=e.target.value.toLowerCase().trim();const hit=nodes.get().filter(n=>v&&n.label.toLowerCase().includes(v)).map(n=>n.id);nodes.update(nodes.get().map(n=>({id:n.id,opacity:!v||hit.includes(n.id)?1:.15})));if(hit.length){net.selectNodes(hit);net.fit({nodes:hit,animation:true})}};
$('zi').onclick=()=>net.moveTo({scale:net.getScale()*1.3,animation:true});$('zo').onclick=()=>net.moveTo({scale:net.getScale()/1.3,animation:true});$('fit').onclick=()=>net.fit({animation:true});
$('ask').onclick=async()=>{$('ans').textContent='Consultando…';const r=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('qq').value})});const j=await r.json();$('ans').textContent=j.error?'Error: '+j.error:j.answer};
})();
</script></body></html>
